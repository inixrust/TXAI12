# Kerangka infra produksi TX-AI12 (on-prem, single-node) di atas Docker.
# Melengkapi compose-oracle.yaml + compose-pgvector.yaml + stack Langfuse yang
# sudah ada. INI KERANGKA - baca infra/README.md dulu untuk langkah bootstrap
# (init & unseal OpenBao, sertifikat, wiring app) dan batasannya.
#
#   docker compose -f infra/compose-infra.yaml up -d
name: txai12-infra

services:
  # --- Siapkan kepemilikan volume data ------------------------------------
  # Volume bernama dibuat root-owned oleh Docker, sedangkan OpenBao berjalan
  # sebagai uid 100 (openbao) dan storage 'file' perlu menulis ke sana. Init
  # sekali-jalan ini men-chown volume lalu keluar; openbao menunggunya selesai.
  openbao-init:
    image: alpine:3
    command: sh -c "chown -R 100:1000 /openbao/data"
    volumes:
      - openbao-data:/openbao/data
    restart: "no"

  # --- Secret manager ------------------------------------------------------
  openbao:
    image: openbao/openbao:latest
    # Config di /openbao/infra (BUKAN /openbao/config yang di-scan otomatis oleh
    # entrypoint image - itu memicu peringatan "duplicate configuration").
    command: server -config=/openbao/infra/config.hcl
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    cap_add: [IPC_LOCK]          # cegah rahasia ter-swap ke disk
    volumes:
      - openbao-data:/openbao/data
      - ./openbao:/openbao/infra:ro    # config.hcl, policy, bootstrap.sh
    # Saat BOOTSTRAP, buka port ke host agar bisa init/unseal + jalankan
    # bootstrap.sh, DAN agar app yang berjalan di host bisa membaca rahasia.
    # Bila app ikut dikontainerkan (jaringan backend internal), TUTUP ini.
    ports:
      - "127.0.0.1:8200:8200"    # host-only, tidak menghadap internet
    networks: [backend]
    restart: unless-stopped
    # Hardening: batasi eskalasi & sumber daya. 'bao status' keluar !=0 saat
    # TERSEGEL -> healthcheck menandai unhealthy sampai di-unseal (sinyal jujur).
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Auto-unseal (substitusi KMS untuk lab) -----------------------------
  # OpenBao TERSEGEL tiap restart. Sidecar ini memantau dan meng-unseal otomatis
  # dari berkas kunci (infra/openbao/unseal-keys.txt, DI-GITIGNORE). Ini
  # menghapus langkah unseal manual yang berulang. Trade-off: kunci ada di
  # berkas -> lindungi (0600). Produksi: pakai auto-unseal transit/KMS.
  openbao-autounseal:
    image: openbao/openbao:latest
    depends_on: [openbao]
    restart: unless-stopped
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./openbao/unseal-keys.txt:/keys/unseal.txt:ro
    networks: [backend]              # harus sejaring dengan openbao
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          if ! bao status >/dev/null 2>&1; then
            while IFS= read -r k; do
              case "$$k" in ""|\#*) continue;; esac
              bao operator unseal "$$k" >/dev/null 2>&1 || true
            done < /keys/unseal.txt
          fi
          sleep 15
        done

  # --- Reverse proxy: satu-satunya yang menghadap keluar -------------------
  caddy:
    image: caddy:2
    depends_on: [app]
    # Port HOST bisa ditimpa bila 80/443 sudah dipakai proses lain (mis. di
    # Docker Desktop, ingress k8s bawaan sudah memegang 80/443). Produksi pakai
    # default 80/443; lab bisa: CADDY_HTTP_PORT=8080 CADDY_HTTPS_PORT=8443 ...
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # CATATAN: Docker Desktop menyediakan 'host.docker.internal' bawaan (IPv4)
    # untuk menjangkau app di host. JANGAN menimpanya dengan
    # `extra_hosts: host.docker.internal:host-gateway` di Docker Desktop -
    # di sebagian versi itu resolve ke gateway IPv6 yang tak didengarkan app
    # (Streamlit bind IPv4), menghasilkan 502. Di Docker Engine Linux murni,
    # tambahkan extra_hosts host-gateway karena tak ada nama bawaan itu.
    networks: [frontend]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  # --- Aplikasi (Streamlit + ragcore), dikontainerkan ---------------------
  # Menghapus "lompatan ke host": Caddy->app dan app->OpenBao/DB kini
  # container->container. Tak ada `ports:` - hanya Caddy yang menjangkaunya.
  app:
    image: txai12-app:latest
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      openbao:
        condition: service_started
    environment:
      RAG_ENV: production
      OPENBAO_ADDR: http://openbao:8200
      # Identitas app ke OpenBao lewat AppRole (bukan token statis yang bisa
      # kedaluwarsa): app LOGIN SEGAR tiap start pakai role_id + secret_id.
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:?set OPENBAO_ROLE_ID (bao read auth/approle/role/txai12/role-id)}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:?set OPENBAO_SECRET_ID (bao write -f auth/approle/role/txai12/secret-id)}
      # Rahasia VARIAN CONTAINER: alamat DB pakai nama container (pg-txai12,
      # oracle-txai12), bukan localhost. Lihat secret/txai12-app di OpenBao.
      OPENBAO_KV_PATH: secret/data/txai12-app
      # OPT-IN kredensial DB DINAMIS: bila diisi (mis. rag_app_dyn), sandi statis
      # pg diganti user efemeral dari OpenBao. Kosong = pakai sandi statis KV.
      OPENBAO_DB_ROLE: ${OPENBAO_DB_ROLE:-}
      STORAGE: pgvector
      MODEL_CHAT: ${MODEL_CHAT:-qwen3:4b}
      # Ollama berjalan di HOST. Di Docker Desktop, container->host lewat
      # host.docker.internal butuh aturan firewall; alternatif: jalankan ollama
      # sebagai container. Timpa sesuai lingkungan.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    networks: [frontend, backend, dbnet]
    # TIDAK ada `ports:` - hanya Caddy yang menjangkaunya (produksi). Untuk akses
    # langsung saat uji/dev, tambah sementara: ports: ["127.0.0.1:8510:8501"].
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  frontend:                     # caddy <-> luar & app
  # backend: openbao <-> app. Kini app DIKONTAINERKAN, jadi komunikasi
  # app<->openbao sepenuhnya di dalam Docker. Bila port 8200 tak lagi di-publish
  # ke host (host app pensiun), jaringan ini boleh 'internal: true' untuk
  # memutus OpenBao dari internet sepenuhnya.
  backend:                      # openbao <-> app
  dbnet:                        # app <-> Oracle & pgvector (jaringan bersama)
    external: true
    name: txai12-net

volumes:
  openbao-data:
  caddy-data:
  caddy-config:
